networks:
  redis-tunnel:
    name: redis-tunnel

services:
  redis-tunnel:
    networks:
      - redis-tunnel
    build:
      context: ./
      dockerfile: ./Dockerfile.db-tunnel
    command: ["/app/entrypoint-redis.sh"]
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "6379"]
      interval: 5s
      timeout: 2s
    volumes:
      - $HOME/.aws:/root/.aws
    environment:
      - AWS_PROFILE
      - AWS_REGION
      - AWS_DEFAULT_REGION
      - AWS_CONFIG_FILE=/root/.aws/config
      - REDIS_ENDPOINT=${REDIS_ENDPOINT}
