name: Build
on:
  workflow_call:

concurrency: build-${{ github.ref }}

env:
  DOCKER_BUILDKIT: "1" # BuildKit is enabled by default starting in Docker v23, Ubuntu 22.04 has an older version

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-26.04
    name: 01-build.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Send build status "in progress"
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/build_status
        with:
          task: build-image
          status: inProgress
          api_key: ${{ secrets.RADIATOR_AUTH_TOKEN }}


      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run 01-build.sh
        run: ./deploy-scripts/01-build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  lint:
    name: 02-lint.sh
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run 02-lint.sh
        run: ./deploy-scripts/02-lint.sh

  run-unit-tests:
    name: 02-2-run-unit-tests.sh
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run 02-2-run-unit-tests.sh
        run: ./deploy-scripts/02-2-run-unit-tests.sh

  push_image:
    name: 03-push-image.sh
    if: github.ref == 'refs/heads/main'
    needs: [ lint, build, run-unit-tests, run-tests-shard ]
    permissions:
      packages: write
      id-token: write
      contents: read
    runs-on: 'ubuntu-26.04'
    steps:
      - name: Fetch history for all branches and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Push image
        uses: ./.github/actions/push_image
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          aws-arn: ${{ secrets.AWS_AOE_UTILITY_ROLE_ARN }}
  run-tests-shard:
    name: 02-1-run-tests.sh (shard ${{ matrix.shard }}/${{ matrix.total_shards }})
    needs: build
    permissions:
      packages: write
      id-token: write
      contents: read
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
        total_shards: [5]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_AOE_UTILITY_ROLE_ARN }}
          role-session-name: aoe-runner-run-tests
          aws-region: eu-west-1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run 02-1-run-tests.sh
        run: ./deploy-scripts/02-1-run-tests.sh
        env:
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}/${{ matrix.total_shards }}

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-blob-${{ matrix.shard }}
          path: playwright-results/blob-report
          retention-days: 1

      - name: Upload a11y scan data
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-data-${{ matrix.shard }}
          path: playwright-results/axe-data
          if-no-files-found: ignore
          retention-days: 1
  build_status_completed:
    name: Send build status
    needs: [push_image]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: 'ubuntu-26.04'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/build_status
        with:
          task: build-image
          status: ${{ needs.push_image.result == 'success' && 'success' || 'failure' }}
          api_key: ${{ secrets.RADIATOR_AUTH_TOKEN }}

